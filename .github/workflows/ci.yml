name: CI

# Consensus node quality gate: build, vet, and the full test suite (including
# the ~40 payback / PaybackV2 tests) must pass on every push and pull request.
# Deliberately no actions/cache: GitHub cache API is billing-blocked on this
# account's self-hosted infra, and the warm local Go module store on a persistent
# runner already covers it. Runs on ubuntu-latest per the audit's Task 1.

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to avoid wasting runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Resolves the exact toolchain pinned in go.mod (go 1.25.11).
          go-version-file: go.mod
          cache: false

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: build opera binary
        run: make opera

      - name: go test ./...
        run: go test ./...

  race:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # The race detector is slow; it runs in a separate job so it parallelizes
      # with build-test. Scoped to the VinuChain fork-delta packages so the
      # consensus-critical paths are always race-checked even if the full
      # -race run is ever trimmed for time.
      - name: go test -race (fork delta)
        run: go test -race ./payback/... ./opera/... ./evmcore/... ./gossip/...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Call-path-aware vulnerability scan. Fails ONLY when a known-vulnerable
      # symbol is actually reachable from this module's code — not merely
      # present in the dependency graph. This automates the manual CVE triage
      # documented by the logrus replace directive in go.mod.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Full-tree BLOCKING gate: the inherited go-ethereum backlog was burned
      # down (every finding fixed or //nolint-with-rationale), so golangci-lint
      # now runs on the whole repo on every push and PR and must stay at zero.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  coverage:
    name: coverage (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Compute coverage
        run: make coverage

      - name: Publish total to job summary
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.prof | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Regression gate: fail if total coverage falls below the floor
      # (baseline 35.5% minus a 1-point slack). Raise the floor in
      # scripts/check-coverage.sh deliberately as coverage climbs.
      - name: Enforce coverage floor
        run: bash scripts/check-coverage.sh cover.prof

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cover-prof
          path: cover.prof
          if-no-files-found: error

  fuzz:
    name: fuzz (time-boxed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Native Go fuzzing of the untrusted P2P message-decode path, bounded so it
      # fits a normal CI run. Any crash the fuzzer finds fails the job (fail-closed)
      # and is saved under testdata/fuzz/ for reproduction.
      - name: Fuzz P2P handleMsg
        run: go test -run=^$ -fuzz='^FuzzHandleMsg$' -fuzztime=120s ./gossip/

      # On a crash, the failing seed written under testdata/fuzz/ is the
      # reproducer. CI is ephemeral, so upload it (the job has already failed).
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: gossip/testdata/fuzz/
          if-no-files-found: ignore

  changelog:
    name: changelog entry (release tags)
    runs-on: ubuntu-latest
    # Runs only on vX.Y.Z release-tag pushes: a release must carry its CHANGELOG
    # entry. Generate it locally with scripts/gen-changelog.sh before tagging.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require a CHANGELOG entry for the release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! grep -q "^### ${tag} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '### ${tag}' entry. Run scripts/gen-changelog.sh and commit it before tagging ${tag}." >&2
            exit 1
          fi
          echo "OK: CHANGELOG.md contains an entry for ${tag}"
